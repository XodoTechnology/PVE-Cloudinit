# Cloud-init template definitions — one per line, pipe-delimited:
#
#   key|offset|template-name|image-url|tags|flags|pattern
#
# Fields:
#   key      unique name; also the sub-directory name that triggers this entry
#   offset   VMID offset from the base VMID you are prompted for at build time.
#            Convention: each OS family gets a block of 10 (x1..x9 usable).
#            e.g. base 9000 + offset 31 -> VMID 9031
#   name     template name; may contain {VER} (resolved below)
#   url      direct image URL, or an index directory when 'index' flag is set.
#            May contain {VER}, resolved to the latest OpenWrt GitHub release.
#   tags     Proxmox tags, separated by ';'  (may contain {VER})
#   flags    comma-separated options:
#              index          url is a directory listing; 'pattern' picks the file
#              gz / xz        image is gzip/xz compressed
#              tarxz          image is a .tar.xz containing a .qcow2
#              bios           boot with SeaBIOS (no OVMF/efidisk)
#              no-customize   skip virt-customize entirely
#              no-cloudinit   do not attach a cloud-init drive
#              no-agent       do not enable the QEMU guest agent
#              storage=X / bridge=X / ram=X / cores=X / disksize=X
#                           per-image overrides of the prompted/global defaults
#   pattern  grep -E regex matched against the index listing (index flag only)

